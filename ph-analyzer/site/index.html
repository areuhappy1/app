<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pH 색상 분석기</title>
<meta name="description" content="시험지 사진으로 pH를 읽는 웹 프로그램. 설치 없이 브라우저에서 바로 측정하고, 사진은 서버로 보내지 않습니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 왼쪽 사진 작업대 + 오른쪽 조작/결과 패널 (폰에서는 위아래로 쌓임) */
:root {
  --bg: #f4f6f4;
  --surface: #ffffff;
  --sunken: #e9eeeb;
  --fg: #1d2421;
  --muted: #5b6761;
  --line: #d6ddd9;
  --accent: #1f7a5a;
  --accent-fg: #ffffff;
  --strip: #d63a2a;
  --patch: #1d6fd6;
  --card: #7a5bd1;
  --good: #1f7a46; --good-bg: #dff3e7;
  --mid: #8a5a00; --mid-bg: #fdf0d2;
  --bad: #a42c22; --bad-bg: #fbe1dd;
  --font-body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121715; --surface: #1a201e; --sunken: #232a27; --fg: #e3ebe6; --muted: #9aa8a1;
    --line: #2e3734; --accent: #4cc596; --accent-fg: #0c1a13;
    --strip: #ff6b5a; --patch: #5aa2ff; --card: #a98cff;
    --good: #7fe0a6; --good-bg: #183526; --mid: #f3cf7a; --mid-bg: #3a2f12; --bad: #ff9a8f; --bad-bg: #3d1d1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121715; --surface: #1a201e; --sunken: #232a27; --fg: #e3ebe6; --muted: #9aa8a1;
  --line: #2e3734; --accent: #4cc596; --accent-fg: #0c1a13;
  --strip: #ff6b5a; --patch: #5aa2ff; --card: #a98cff;
  --good: #7fe0a6; --good-bg: #183526; --mid: #f3cf7a; --mid-bg: #3a2f12; --bad: #ff9a8f; --bad-bg: #3d1d1a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  word-break: keep-all; overflow-wrap: anywhere;
}
.wrap {
  max-width: 1200px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 48px;
  display: grid; gap: 16px;
}
h1, h2, h3 { margin: 0; line-height: 1.3; text-wrap: balance; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }

/* 헤더 */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.brand { display: flex; align-items: center; gap: 12px; }
.band { display: grid; grid-template-columns: repeat(7, 10px); height: 26px; border-radius: 4px; overflow: hidden; }
.band i { display: block; }
.brand h1 { font-size: 1.35rem; }
.toplinks { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.92rem; }
.toplinks a { color: var(--accent); text-decoration: none; font-weight: 500; }
.toplinks a:hover { text-decoration: underline; }

/* 탭 */
.tabs { display: flex; gap: 4px; background: var(--sunken); padding: 4px; border-radius: 10px; overflow-x: auto; }
.tab {
  flex: 1 0 auto; border: 0; background: transparent; padding: 9px 14px; border-radius: 7px;
  cursor: pointer; font-weight: 500; color: var(--muted); white-space: nowrap;
}
.tab[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.tab:focus-visible, .btn:focus-visible, .linkbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* 작업 영역 */
.work { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .work { grid-template-columns: minmax(0, 1fr); } }

.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: grid; min-width: 0; }
.stagebar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; justify-content: space-between;
  padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface);
}
.prompt { font-weight: 500; }
.prompt b { color: var(--accent); }
.prompt.idle { color: var(--muted); font-weight: 400; }
.stagebtns { display: flex; flex-wrap: wrap; gap: 6px; }
.canvasbox { position: relative; background: var(--sunken); min-height: 280px; display: grid; place-items: center; }
#view { display: block; max-width: 100%; max-height: 78vh; width: auto; height: auto; }
#view.selecting { cursor: crosshair; touch-action: none; }
.empty { padding: 32px 20px; display: grid; gap: 14px; justify-items: center; text-align: center; max-width: 440px; }
.empty ol { text-align: left; margin: 0; padding-left: 1.3em; display: grid; gap: 4px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 12px; font-size: 0.82rem; color: var(--muted); border-top: 1px solid var(--line); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border: 2px solid currentColor; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.lg-strip { color: var(--strip); } .lg-patch { color: var(--patch); } .lg-card { color: var(--card); }
.legend span { color: var(--muted); }
.legend span.lg-strip::before { border-color: var(--strip); }
.legend span.lg-patch::before { border-color: var(--patch); }
.legend span.lg-card::before { border-color: var(--card); }

/* 패널 */
.panel { display: grid; gap: 12px; min-width: 0; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.box h2 { font-size: 1rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn {
  border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px;
  cursor: pointer; font-weight: 500;
}
.btn:hover { background: var(--sunken); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.block { width: 100%; padding: 11px 14px; }
.btn[disabled] { opacity: .5; cursor: default; }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-weight: 500; }
label.field { display: grid; gap: 4px; font-size: 0.88rem; color: var(--muted); }
input[type="number"], input[type="text"], select {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-width: 0;
}
input[type="number"] { width: 90px; }
.check { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

/* 결과 */
.result { display: grid; gap: 10px; }
.bigph { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.bigph .num { font-size: 3.2rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.bigph .unit { color: var(--muted); font-weight: 500; }
.swatch { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--line); flex: 0 0 auto; }
.chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.82rem; font-weight: 700; }
.chip.c-높음 { background: var(--good-bg); color: var(--good); }
.chip.c-보통 { background: var(--mid-bg); color: var(--mid); }
.chip.c-낮음 { background: var(--bad-bg); color: var(--bad); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 0.9rem; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.warns { margin: 0; padding: 8px 12px 8px 28px; background: var(--mid-bg); color: var(--mid); border-radius: 8px; font-size: 0.88rem; display: grid; gap: 2px; }
.scale { position: relative; height: 14px; border-radius: 4px; overflow: hidden; display: grid; grid-auto-flow: column; }
.scale-wrap { display: grid; gap: 2px; }
.scale i { display: block; }
.scale-marker { position: absolute; top: -3px; width: 3px; height: 20px; background: var(--fg); border-radius: 2px; transform: translateX(-1px); box-shadow: 0 0 0 2px var(--surface); }
.scale-labels { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* 목록 */
.patchlist { display: grid; gap: 6px; max-height: 260px; overflow: auto; }
.patchrow { display: flex; align-items: center; gap: 8px; }
.patchrow .idx { width: 22px; height: 22px; border-radius: 50%; background: var(--patch); color: #fff; font-size: 0.75rem; display: grid; place-items: center; font-weight: 700; flex: 0 0 auto; }
.refgroup { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px solid var(--line); }
.refgroup:last-child { border-bottom: 0; }
.refgroup .ph { width: 64px; font-weight: 700; font-variant-numeric: tabular-nums; }
.refchip { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 6px; padding: 2px 2px 2px 2px; }
.refchip i { width: 18px; height: 18px; border-radius: 4px; display: block; }
.refchip button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 4px; font-size: 0.9rem; line-height: 1; }
.refchip button:hover { color: var(--bad); }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 700; color: var(--muted); font-size: 0.82rem; }
td.num { font-variant-numeric: tabular-nums; }

.note { font-size: 0.84rem; color: var(--muted); }
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 0.9rem;
  max-width: calc(100% - 32px); z-index: 20;
}
.err { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 10px 12px; font-size: 0.9rem; }
footer { font-size: 0.82rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; }
@media (prefers-reduced-motion: no-preference) { .tab, .btn { transition: background .15s, color .15s; } }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <div class="band" aria-hidden="true">
        <i style="background:#e65a32"></i><i style="background:#f09628"></i><i style="background:#e1c828"></i><i style="background:#96be3c"></i><i style="background:#3ca05a"></i><i style="background:#288296"></i><i style="background:#3250aa"></i>
      </div>
      <h1>pH 색상 분석기</h1>
    </div>
    <nav class="toplinks">
      <a href="guide.html">사용 안내</a>
      <a href="guide.html#windows">Windows 프로그램 받기</a>
    </nav>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-chart" aria-selected="true" data-tab="chart">색표로 측정</button>
    <button class="tab" role="tab" id="tab-ref" aria-selected="false" data-tab="ref">기준색으로 측정</button>
    <button class="tab" role="tab" id="tab-history" aria-selected="false" data-tab="history">측정 기록 <span id="hist-count" class="muted"></span></button>
  </div>

  <div class="work" id="work">
    <section class="stage" aria-label="사진">
      <div class="stagebar">
        <p class="prompt idle" id="prompt">사진을 고르면 여기에 표시됩니다.</p>
        <div class="stagebtns" id="stagebtns"></div>
      </div>
      <div class="canvasbox" id="canvasbox">
        <canvas id="view" hidden></canvas>
        <div class="empty" id="empty">
          <p><b>시험지와 상자 색표를 한 사진에 찍어 주세요.</b></p>
          <ol>
            <li>처음 한 번 색표 칸과 시험지 위치를 지정합니다.</li>
            <li>그다음부터는 사진만 고르면 pH가 바로 나옵니다.</li>
            <li>사진은 이 기기 안에서만 계산하고 서버로 보내지 않습니다.</li>
          </ol>
          <button class="btn" id="try-sample" data-act="try-sample" type="button">예시 사진으로 체험</button>
        </div>
      </div>
      <div class="legend" id="legend">
        <span class="lg-patch">색표 칸</span><span class="lg-strip">시험지</span><span class="lg-card">흰색/회색 카드</span>
      </div>
    </section>

    <aside class="panel" id="panel"></aside>
  </div>

  <section id="history" hidden></section>

  <footer>
    <span>사진과 기록은 이 브라우저에만 저장됩니다. 다른 기기와 공유되지 않습니다.</span>
    <span>시험지 판독값은 참고용입니다. 중요한 판단 전에는 pH 미터로 확인하세요.</span>
  </footer>
</div>

<input type="file" id="file" accept="image/*" hidden>
<div class="toast" id="toast" hidden role="status"></div>

<script src="ph-core.js"></script>
<script src="app.js"></script>
</body>
</html>
