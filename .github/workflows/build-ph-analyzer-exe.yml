name: Build pH Analyzer EXE

# ph-analyzer/v6 가 바뀌면 Windows에서 EXE를 빌드해 GitHub Release "ph-analyzer-v6"에 올린다.
# 내려받기 주소: https://github.com/areuhappy1/app/releases/download/ph-analyzer-v6/pH_Analyzer_v6.exe
on:
  push:
    branches:
      - main
      - claude/image-color-detection-review-d2ggb1
    paths:
      - "ph-analyzer/v6/**"
      - ".github/workflows/build-ph-analyzer-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ph-analyzer-exe
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: ph-analyzer/v6
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencv-python numpy pyinstaller

      - name: Self test
        run: python test_ph_core.py

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name pH_Analyzer_v6 ph_color_analyzer_v6.py

      - name: Check EXE
        run: |
          if (-not (Test-Path dist/pH_Analyzer_v6.exe)) { throw "EXE was not created" }
          (Get-Item dist/pH_Analyzer_v6.exe).Length / 1MB

      - uses: actions/upload-artifact@v4
        with:
          name: pH_Analyzer_v6
          path: ph-analyzer/v6/dist/pH_Analyzer_v6.exe

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "ph-analyzer-v6"
          $notes = "Windows용 pH 색상 분석기 V6. pH_Analyzer_v6.exe 를 내려받아 바로 실행하세요. (빌드 커밋: ${{ github.sha }})"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/pH_Analyzer_v6.exe --clobber
            gh release edit $tag --notes $notes
          } else {
            gh release create $tag dist/pH_Analyzer_v6.exe --title "pH 색상 분석기 V6 (Windows)" --notes $notes --target ${{ github.sha }}
          }
